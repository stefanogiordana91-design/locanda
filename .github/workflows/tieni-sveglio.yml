# LOCANDA · tappa 5.1b — «tieni sveglio» il progetto Supabase gratuito.
# Il piano gratuito mette in pausa il progetto dopo 7 giorni senza attività: ogni 3 giorni questa azione
# fa una lettura sul database (tabella compendium) con la chiave pubblica dell'app.
# Segreti del repository richiesti: SUPABASE_URL e SUPABASE_ANON_KEY (gli stessi di apps/mobile/.env).
name: Tieni sveglio Supabase
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sveglia:
    runs-on: ubuntu-latest
    steps:
      - name: Una lettura sul database
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/compendium?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "risposta del database: $code"
          test "$code" = "200"
      - uses: actions/checkout@v4
      - name: Un segno al mese nel repository (GitHub spegne le azioni pianificate dopo 60 giorni senza attività)
        run: |
          if [ "$(date +%d)" -le 3 ]; then
            date -u +%Y-%m-%dT%H:%MZ > .sveglia
            git config user.name "tieni-sveglio"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .sveglia
            git commit -m "sveglia $(date -u +%Y-%m-%d)" && git push || true
          fi
